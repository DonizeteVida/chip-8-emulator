[package]
name = "chip-8-emulator"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
cpal = "0.18.2"
rand = "0.10.2"
ratatui = { version = "0.30.2", optional = true }
sdl3 = { version = "0.18.4", features = ["build-from-source-static", "unsafe_textures"], optional = true }

[features]
default = ["sdl3_window"]
terminal_window = []
rata = ["ratatui"]
sdl3_window = ["sdl3"]
